# Primary navigation, rendered by _includes/portfolio-nav.html.
#
# Each entry is one of:
#   section:      link to a homepage section anchor (/#<section>)
#   url:          link to a standalone page; pair with `section` to mark it
#                 active when a page or collection record belongs to it
#   divider: true insert the vertical rule
#   style: button render as the outlined call-to-action
main:
  - title: "Research"
    section: research

  - title: "Publications"
    section: publications

  - title: "Projects"
    section: projects

  - title: "Teaching"
    section: teaching

  - title: "About"
    section: about

  - divider: true

  - title: "Talks"
    url: /talks/
    section: talks

  - title: "Leadership"
    url: /leadership/
    section: leadership

  - title: "Contact"
    section: contact
    style: button
