<!doctype html>
<html lang="en" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% include seo.html %}
  <meta name="theme-color" content="#111111">
  <link rel="icon" href="{{ '/images/favicon.ico' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/portfolio.css' | relative_url }}">
  <script src="{{ '/assets/js/portfolio.js' | relative_url }}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  {% include portfolio-nav.html %}
  <main id="main" tabindex="-1">{{ content }}</main>
  <footer class="site-footer"><div class="container">
    <div class="footer-primary"><p>© {{ site.time | date: '%Y' }} · Shreyan Mitra · Built with care</p><p>Last updated <time datetime="{{ site.data.portfolio_ui.last_updated | date: '%Y-%m-%d' }}">{{ site.data.portfolio_ui.last_updated | date: '%B %Y' }}</time></p></div>
    <nav class="footer-links" aria-label="Footer"><a href="{{ '/sitemap/' | relative_url }}">Sitemap</a><a href="{{ '/feed.xml' | relative_url }}">RSS</a><a href="#main">Back to top {% include portfolio-icon.html name='up' %}</a></nav>
  </div></footer>
</body>
</html>
